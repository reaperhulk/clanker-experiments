name: libheifer development and completion gates
on:
  pull_request:
    paths: ['libheifer/**', '.github/workflows/libheifer.yml', '.gitmodules']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust build (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: libheifer
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - run: cargo test --locked -p libheifer --all-features
      - run: cargo build --locked --release -p libheifer-capi

  differential:
    name: Independent C clients (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libheifer
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy
      - run: python -m pip install libclang==18.1.1
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --no-default-features
      - run: cargo test --locked --workspace --all-features
      - run: python tools/inventory.py --check
      - run: python tools/audit_dependencies.py
      - run: python tools/build_reference.py --hevc
      - run: cargo build --locked --release -p libheifer-capi
      - run: cargo build --locked --release --features hevc --example hevc_probe
      - run: python tools/test_brands.py --reference-build .build/reference
      - run: python tools/test_brand_boxes.py --reference-build .build/reference
      - run: python tools/test_brand_boxes.py --reference-build .build/reference --sanitize --output .build/brand-boxes-sanitized-report.json
      - run: python tools/test_images.py --reference-build .build/reference
      - run: python tools/test_color.py --reference-build .build/reference
      - run: python tools/test_context.py --reference-build .build/reference
      - run: python tools/test_items.py --reference-build .build/reference
      - run: python tools/test_add_metadata.py --reference-build .build/reference
      - run: python tools/test_text.py --reference-build .build/reference
      - run: python tools/test_uncompressed_config.py --reference-build .build/reference
      - run: python tools/test_uncompressed_pixels.py --reference-build .build/reference
      - run: python tools/test_uncompressed_units.py --reference-build .build/reference
      - run: python tools/test_sequence_samples.py --reference-build .build/reference
      - run: python tools/test_encoding_options.py --reference-build .build/reference
      - run: python tools/test_encoding_options.py --reference-build .build/reference --sanitize --output .build/encoding-options-sanitized-report.json
      - run: python tools/test_omaf.py --reference-build .build/reference
      - run: python tools/test_omaf.py --reference-build .build/reference --sanitize --output .build/omaf-sanitized-report.json
      - run: python tools/test_sequence_samples.py --reference-build .build/reference --sanitize --output .build/sequence-samples-sanitized-report.json
      - run: python tools/test_uncompressed_units.py --reference-build .build/reference --sanitize --output .build/uncompressed-units-sanitized-report.json
      - run: python tools/test_uncompressed_pixels.py --reference-build .build/reference --sanitize --output .build/uncompressed-pixels-sanitized-report.json
      - run: python tools/test_uncompressed_config.py --reference-build .build/reference --sanitize --output .build/uncompressed-config-sanitized-report.json
      - run: python tools/test_handle_color.py --reference-build .build/reference
      - run: python tools/test_handle_color.py --reference-build .build/reference --sanitize --output .build/handle-color-sanitized-report.json
      - run: python tools/test_image_area.py --reference-build .build/reference
      - run: python tools/test_image_area.py --reference-build .build/reference --sanitize --output .build/image-area-sanitized-report.json
      - run: python tools/test_text.py --reference-build .build/reference --sanitize --output .build/text-sanitized-report.json
      - run: python tools/test_add_metadata.py --reference-build .build/reference --sanitize --output .build/add-metadata-sanitized-report.json
      - run: python tools/test_metadata_compression.py --reference-build .build/reference
      - run: python tools/test_items.py --reference-build .build/reference --sanitize --output .build/items-sanitized-report.json
      - run: python tools/test_metadata_compression.py --reference-build .build/reference --sanitize --output .build/metadata-compression-sanitized-report.json
      - run: python tools/test_auxiliary.py --reference-build .build/reference
      - run: python tools/test_properties.py --reference-build .build/reference
      - run: python tools/test_properties.py --reference-build .build/reference --sanitize --output .build/properties-sanitized-report.json
      - run: python tools/test_decode_properties.py --reference-build .build/reference
      - run: python tools/test_camera.py --reference-build .build/reference
      - run: python tools/test_sensor.py --reference-build .build/reference
      - run: python tools/test_tai.py --reference-build .build/reference
      - run: python tools/test_tai.py --reference-build .build/reference --sanitize --output .build/tai-sanitized-report.json
      - run: python tools/test_components.py --reference-build .build/reference
      - run: python tools/test_component_handles.py --reference-build .build/reference
      - run: python tools/test_component_handles.py --reference-build .build/reference --sanitize --output .build/component-handles-sanitized-report.json
      - run: python tools/test_components.py --reference-build .build/reference --sanitize --output .build/components-sanitized-report.json
      - run: python tools/test_sensor.py --reference-build .build/reference --sanitize --output .build/sensor-sanitized-report.json
      - run: python tools/test_camera.py --reference-build .build/reference --sanitize --output .build/camera-sanitized-report.json
      - run: python tools/test_auxiliary.py --reference-build .build/reference --sanitize --output .build/auxiliary-sanitized-report.json
      - run: python tools/test_context.py --reference-build .build/reference --sanitize --output .build/context-sanitized-report.json
      - run: python tools/test_decoding_options.py --reference-build .build/reference
      - run: python tools/test_decoding_options.py --reference-build .build/reference --sanitize --output .build/decoding-options-sanitized-report.json
      - run: python tools/test_transforms.py --reference-build .build/reference
      - run: python tools/test_decode.py --reference-build .build/reference
      - run: python tools/test_hevc_limits.py --reference-build .build/reference
      - run: python tools/test_error_lifetimes.py --reference-build .build/reference
      - run: python tools/test_error_lifetimes.py --reference-build .build/reference --sanitize --output .build/error-lifetimes-sanitized-report.json
      - run: python tools/test_decode_geometry.py --reference-build .build/reference
      - run: python tools/test_decode_derived.py --reference-build .build/reference
      - run: python tools/test_decode_overlay.py --reference-build .build/reference
      - run: python tools/test_decode_mask.py --reference-build .build/reference
      - run: CARGO_TARGET_DIR=.build/no-codecs cargo build --locked --release -p libheifer-capi --no-default-features
      - run: python tools/test_encoding_options.py --reference-build .build/reference --candidate .build/no-codecs/release/libheifer.so --output .build/no-codecs-encoding-options-report.json
      - run: python tools/test_omaf.py --reference-build .build/reference --candidate .build/no-codecs/release/libheifer.so --output .build/no-codecs-omaf-report.json
      - run: python tools/test_sequence_samples.py --reference-build .build/reference --candidate .build/no-codecs/release/libheifer.so --output .build/no-codecs-sequence-samples-report.json
      - run: python tools/test_uncompressed_units.py --reference-build .build/reference --candidate .build/no-codecs/release/libheifer.so --output .build/no-codecs-uncompressed-units-report.json
      - run: python tools/test_uncompressed_pixels.py --reference-build .build/reference --candidate .build/no-codecs/release/libheifer.so --output .build/no-codecs-uncompressed-pixels-report.json
      - run: python tools/test_uncompressed_config.py --reference-build .build/reference --candidate .build/no-codecs/release/libheifer.so --output .build/no-codecs-uncompressed-config-report.json
      - run: python tools/test_handle_color.py --reference-build .build/reference --candidate .build/no-codecs/release/libheifer.so --output .build/no-codecs-handle-color-report.json
      - run: python tools/test_image_area.py --reference-build .build/reference --candidate .build/no-codecs/release/libheifer.so --output .build/no-codecs-image-area-report.json
      - run: python tools/test_text.py --reference-build .build/reference --candidate .build/no-codecs/release/libheifer.so --output .build/no-codecs-text-report.json
      - run: python tools/test_add_metadata.py --reference-build .build/reference --candidate .build/no-codecs/release/libheifer.so --output .build/no-codecs-add-metadata-report.json
      - run: python tools/test_tai.py --reference-build .build/reference --candidate .build/no-codecs/release/libheifer.so --without-hevc --output .build/no-codecs-tai-report.json
      - run: python tools/test_items.py --reference-build .build/reference --candidate .build/no-codecs/release/libheifer.so --output .build/no-codecs-items-report.json
      - run: python tools/test_metadata_compression.py --reference-build .build/reference --candidate .build/no-codecs/release/libheifer.so --output .build/no-codecs-metadata-compression-report.json
      - run: python tools/test_auxiliary.py --reference-build .build/reference --candidate .build/no-codecs/release/libheifer.so --output .build/no-codecs-auxiliary-report.json
      - run: python tools/test_properties.py --reference-build .build/reference --candidate .build/no-codecs/release/libheifer.so --output .build/no-codecs-properties-report.json
      - run: python tools/test_camera.py --reference-build .build/reference --candidate .build/no-codecs/release/libheifer.so --output .build/no-codecs-camera-report.json
      - run: python tools/test_sensor.py --reference-build .build/reference --candidate .build/no-codecs/release/libheifer.so --output .build/no-codecs-sensor-report.json
      - run: python tools/test_components.py --reference-build .build/reference --candidate .build/no-codecs/release/libheifer.so --output .build/no-codecs-components-report.json
      - run: python tools/test_component_handles.py --reference-build .build/reference --candidate .build/no-codecs/release/libheifer.so --descriptions-only --output .build/no-codecs-component-handles-report.json
      - run: python tools/test_decode_mask.py --reference-build .build/reference --candidate .build/no-codecs/release/libheifer.so --work .build/no-codecs-decode --output .build/no-codecs-mask-report.json
      - run: python tools/test_decode_graphs.py --reference-build .build/reference
      - run: python tools/test_derived_handles.py --reference-build .build/reference
      - run: python tools/test_derived_handles.py --reference-build .build/reference --sanitize --output .build/derived-handles-sanitized-report.json
      - run: python tools/test_security.py --reference-build .build/reference
      - run: python tools/test_security.py --reference-build .build/reference --sanitize --output .build/security-sanitized-report.json
      - run: python tools/test_security_lifetimes.py --reference-build .build/reference
      - run: python tools/test_warnings.py --reference-build .build/reference
      - run: python tools/test_warnings.py --reference-build .build/reference --sanitize --output .build/warnings-sanitized-report.json
      - run: python tools/test_hevc.py --reference-build .build/reference --require-default-output
      - run: python tools/test_mutations.py --reference-build .build/reference
      - run: python tools/check_coverage.py --reference .build/reference/libheif/libheif.so --development
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: libheifer-development-evidence
          path: |
            libheifer/.build/*report.json
            libheifer/.build/coverage.json
            libheifer/.build/dependencies.json
      # Intentionally fail until the complete contract is implemented. Passing
      # the preceding development tests must never imply a compatible replacement.
      - name: Full API completion (expected to fail during implementation)
        run: python tools/check_coverage.py
