# Vendored for libheifer from rav1e 0.8.1 (crates.io; identical to git tag
# v0.8.1, commit 1fe82de02510767539e89b2ee6fa846920ae2686). Rust-only: the
# assembly sources, the asm/cc/nasm build path, the binaries and the native
# decoder test features are removed. See LIBHEIFER_CHANGES.md.

[package]
edition = "2021"
rust-version = "1.83.0"
name = "rav1e"
version = "0.8.1"
authors = ["Thomas Daede <tdaede@xiph.org>"]
build = "build.rs"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "The fastest and safest AV1 encoder"
readme = "README.md"
license = "BSD-2-Clause"
repository = "https://github.com/xiph/rav1e/"

[lib]
name = "rav1e"
path = "src/lib.rs"
bench = false

[features]
default = []
capi = ["scan_fmt"]
threading = ["rayon/threads"]

[dependencies]
aligned-vec = "0.6.0"
arg_enum_proc_macro = "0.3.4"
arrayvec = "0.7"
av-scenechange = { version = "0.14.1", default-features = false }
av1-grain = "0.2.3"
bitstream-io = "4.1.0"
cfg-if = "1.0"
itertools = "0.14"
libc = "0.2"
log = "0.4"
new_debug_unreachable = "1.0.4"
noop_proc_macro = "0.3.0"
num-derive = "0.4"
num-traits = "0.2"
paste = "1.0"
profiling = "1"
rayon = { version = "0.1", default-features = false, package = "maybe-rayon" }
scan_fmt = { version = "0.2.6", optional = true, default-features = false }
simd_helpers = "0.1"
thiserror = "2.0"
v_frame = "0.3.7"

[build-dependencies]
built = { version = "0.8.0", features = [] }
