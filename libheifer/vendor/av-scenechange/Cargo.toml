# Vendored for libheifer from av-scenechange 0.14.1 (crates.io). Rust-only:
# the assembly sources, the asm/cc/nasm build path, the binary and the
# ffmpeg/vapoursynth/tracing/serialization features are removed. See
# LIBHEIFER_CHANGES.md.

[package]
edition = "2021"
rust-version = "1.74.1"
name = "av-scenechange"
version = "0.14.1"
authors = ["Josh Holmer <jholmer.in@gmail.com>"]
build = "build.rs"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Estimates frames in a video where a scenecut would be ideal"
readme = "README.md"
license = "MIT"
repository = "https://github.com/rust-av/av-scenechange"

[features]
default = []

[lib]
name = "av_scenechange"
path = "src/lib.rs"

[dependencies]
aligned = "0.4.2"
anyhow = "1.0.56"
arg_enum_proc_macro = "0.3.4"
arrayvec = "0.7.6"
log = "0.4.14"
num-rational = { version = "0.4.2", default-features = false }
num-traits = "0.2.19"
pastey = "0.1.0"
rayon = "1.10.0"
thiserror = "2.0.12"
v_frame = "0.3.8"
y4m = "0.8.0"

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = [
    "cfg(asm_x86_64)",
    "cfg(asm_neon)",
]
